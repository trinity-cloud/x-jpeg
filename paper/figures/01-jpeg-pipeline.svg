<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How JPEG compression works</title>
  <desc id="desc">A left-to-right diagram of baseline JPEG encoding and decoding, highlighting quantization as the lossy decision point.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/>
    </marker>
    <linearGradient id="qgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#cffafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font:700 34px Inter,Helvetica,Arial,sans-serif;fill:#0f172a}.subtitle{font:400 18px Inter,Helvetica,Arial,sans-serif;fill:#475569}
      .stage{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.stageTitle{font:700 18px Inter,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.stageBody{font:400 14px Inter,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}
      .num{font:700 14px Inter,Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .small{font:500 14px Inter,Helvetica,Arial,sans-serif;fill:#475569}.callTitle{font:700 18px Inter,Helvetica,Arial,sans-serif;fill:#0f172a}.callBody{font:400 15px Inter,Helvetica,Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="60" y="60" class="title">How ordinary JPEG turns pixels into a bitstream</text>
  <text x="60" y="92" class="subtitle">Most stages are reversible engineering choices. Quantization is where information is deliberately discarded.</text>

  <g transform="translate(55 145)">
    <g transform="translate(0 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">1</text>
      <rect x="40" y="47" width="70" height="52" rx="8" fill="#f97316" opacity=".9"/>
      <circle cx="72" cy="70" r="18" fill="#facc15"/><path d="M40 92 L65 69 L82 83 L99 65 L110 79 L110 99 L40 99Z" fill="#0f766e"/>
      <text x="75" y="125" class="stageTitle">RGB image</text><text x="75" y="148" class="stageBody">8 bits × 3 channels</text>
    </g>
    <path class="arrow" d="M155 82 H190"/>
    <g transform="translate(195 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">2</text>
      <rect x="27" y="48" width="28" height="51" rx="5" fill="#fde047"/><rect x="61" y="48" width="28" height="51" rx="5" fill="#67e8f9"/><rect x="95" y="48" width="28" height="51" rx="5" fill="#f0abfc"/>
      <text x="75" y="125" class="stageTitle">RGB → YCbCr</text><text x="75" y="148" class="stageBody">luma + two chroma</text>
    </g>
    <path class="arrow" d="M350 82 H385"/>
    <g transform="translate(390 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">3</text>
      <rect x="31" y="47" width="42" height="52" rx="4" fill="#fde047"/><rect x="82" y="47" width="20" height="24" rx="3" fill="#67e8f9"/><rect x="106" y="47" width="20" height="24" rx="3" fill="#f0abfc"/>
      <text x="75" y="125" class="stageTitle">4:2:0 sampling</text><text x="75" y="148" class="stageBody">reduce chroma resolution</text>
    </g>
    <path class="arrow" d="M545 82 H580"/>
    <g transform="translate(585 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">4</text>
      <g stroke="#94a3b8" stroke-width="1" fill="#e2e8f0"><rect x="43" y="45" width="64" height="64"/>
        <path d="M51 45V109M59 45V109M67 45V109M75 45V109M83 45V109M91 45V109M99 45V109M43 53H107M43 61H107M43 69H107M43 77H107M43 85H107M43 93H107M43 101H107"/>
      </g>
      <text x="75" y="125" class="stageTitle">8×8 blocks</text><text x="75" y="148" class="stageBody">level-shift each block</text>
    </g>
    <path class="arrow" d="M740 82 H775"/>
    <g transform="translate(780 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">5</text>
      <path d="M28 90 C45 42 55 42 72 90 S99 138 122 62" fill="none" stroke="#4f46e5" stroke-width="5"/>
      <text x="75" y="125" class="stageTitle">2-D DCT</text><text x="75" y="148" class="stageBody">pixels → frequencies</text>
    </g>
    <path class="arrow" d="M935 82 H970"/>
    <g transform="translate(975 -12)">
      <rect width="170" height="189" rx="18" fill="url(#qgrad)" stroke="#0891b2" stroke-width="4" filter="url(#shadow)"/>
      <circle cx="24" cy="25" r="15" fill="#0891b2"/><text x="24" y="25" class="num">6</text>
      <text x="85" y="58" class="stageTitle">Quantize</text>
      <text x="85" y="89" style="font:600 19px Inter,Helvetica,Arial,sans-serif;fill:#0e7490;text-anchor:middle">k = round(F ÷ Q)</text>
      <text x="85" y="119" class="stageBody">Q is an 8×8 table</text>
      <rect x="30" y="137" width="110" height="29" rx="14" fill="#0891b2"/><text x="85" y="157" style="font:700 13px Inter,Helvetica,Arial,sans-serif;fill:white;text-anchor:middle">THE LOSSY STEP</text>
    </g>
    <path d="M1150 82 H1185" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(1190 0)">
      <rect class="stage" width="150" height="165"/>
      <circle cx="24" cy="25" r="15" fill="#334155"/><text x="24" y="25" class="num">7</text>
      <path d="M35 48 H115 M35 62 H101 M35 76 H121 M35 90 H89" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <text x="75" y="125" class="stageTitle">Entropy code</text><text x="75" y="148" class="stageBody">zig-zag, RLE, Huffman</text>
    </g>
  </g>

  <g transform="translate(55 382)">
    <rect width="860" height="142" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="38" class="callTitle">What the JPEG file contains</text>
    <g transform="translate(28 58)">
      <rect width="135" height="50" rx="8" fill="#e2e8f0"/><text x="67" y="31" class="small" text-anchor="middle">headers / metadata</text>
      <rect x="145" width="160" height="50" rx="8" fill="#cffafe" stroke="#0891b2"/><text x="225" y="22" class="small" text-anchor="middle">DQT segments</text><text x="225" y="39" class="small" text-anchor="middle">the Q tables</text>
      <rect x="315" width="170" height="50" rx="8" fill="#ede9fe"/><text x="400" y="31" class="small" text-anchor="middle">Huffman tables</text>
      <rect x="495" width="325" height="50" rx="8" fill="#dbeafe"/><text x="657" y="31" class="small" text-anchor="middle">entropy-coded coefficient stream</text>
    </g>
  </g>
  <g transform="translate(945 382)">
    <rect width="400" height="142" rx="18" fill="#0f172a"/>
    <text x="25" y="38" style="font:700 18px Inter,Helvetica,Arial,sans-serif;fill:#fff">Decoding reverses the pipeline</text>
    <text x="25" y="69" style="font:400 15px Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1">Huffman decode → dequantize → IDCT</text>
    <text x="25" y="93" style="font:400 15px Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1">→ chroma upsample → RGB</text>
    <text x="25" y="121" style="font:700 15px Inter,Helvetica,Arial,sans-serif;fill:#67e8f9">The decoder reads Q directly from the file.</text>
  </g>

  <g transform="translate(55 565)">
    <rect width="1290" height="130" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="52" cy="65" r="31" fill="#f97316"/><text x="52" y="73" style="font:800 23px Inter,Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle">Q</text>
    <text x="102" y="43" class="callTitle">The compression decision lives in 64 numbers per component</text>
    <text x="102" y="71" class="callBody">Small Q entries preserve a frequency but cost more bits. Large entries discard more detail and usually create more zeros.</text>
    <text x="102" y="98" class="callBody">Traditional encoders start from fixed, human-designed table shapes and scale them with one quality setting.</text>
    <rect x="1000" y="32" width="250" height="66" rx="14" fill="#fff" stroke="#f97316" stroke-width="2"/>
    <text x="1125" y="58" style="font:700 16px Inter,Helvetica,Arial,sans-serif;fill:#c2410c;text-anchor:middle">X-JPEG changes this box</text>
    <text x="1125" y="82" style="font:500 14px Inter,Helvetica,Arial,sans-serif;fill:#7c2d12;text-anchor:middle">Q becomes image-adaptive</text>
  </g>
</svg>
