<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">How X-JPEG is trained</title>
  <desc id="desc">A differentiable training graph combines RGB and luma MS-SSIM distortion, a DCT symbol-rate proxy, optional table entropy, JPEG MSE and an optional mirror autoencoder reconstruction. Real JPEG files are used for evaluation.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0891b2"/></marker>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>.title{font:700 34px Inter,Helvetica,Arial,sans-serif;fill:#0f172a}.sub{font:400 18px Inter,Helvetica,Arial,sans-serif;fill:#475569}.h{font:700 18px Inter,Helvetica,Arial,sans-serif;fill:#0f172a;text-anchor:middle}.b{font:400 14px Inter,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.cyan{stroke:#0891b2;stroke-width:4;fill:none;marker-end:url(#c)}</style>
  </defs>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="60" y="60" class="title">Training through JPEG without pretending JPEG is differentiable</text>
  <text x="60" y="92" class="sub">The forward pass performs exact rounding; the backward pass uses a straight-through gradient. Final claims are re-measured with real files.</text>

  <g transform="translate(55 180)">
    <rect width="150" height="150" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#s)"/>
    <rect x="35" y="25" width="80" height="65" rx="8" fill="#f97316"/><path d="M35 80L58 53L78 72L93 48L115 71V90H35Z" fill="#0f766e"/>
    <text x="75" y="118" class="h">training image x</text><text x="75" y="139" class="b">COCO crop</text>
  </g>
  <path d="M205 255H280" class="line"/>
  <g transform="translate(285 170)">
    <rect width="220" height="170" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="3" filter="url(#s)"/>
    <text x="110" y="38" class="h">table predictor fθ</text>
    <path d="M47 72H173M59 92H161M72 112H148" stroke="#0891b2" stroke-width="9" stroke-linecap="round"/>
    <text x="110" y="145" class="b">thumbnail + DCT stats</text>
  </g>
  <path d="M505 255H585" class="cyan"/>
  <g transform="translate(590 160)">
    <rect width="220" height="190" rx="22" fill="#fff" stroke="#4f46e5" stroke-width="3" filter="url(#s)"/>
    <text x="110" y="37" class="h">predicted tables T</text>
    <rect x="34" y="58" width="42" height="42" rx="6" fill="#fde047"/><rect x="89" y="58" width="42" height="42" rx="6" fill="#67e8f9"/><rect x="144" y="58" width="42" height="42" rx="6" fill="#f0abfc"/>
    <text x="55" y="85" class="h">Y</text><text x="110" y="85" class="h">Cb</text><text x="165" y="85" class="h">Cr</text>
    <text x="110" y="128" class="b">uniform noise ±0.5 for</text><text x="110" y="149" class="b">soft integer-table training</text><text x="110" y="173" class="b">hard rounding at inference</text>
  </g>
  <path d="M810 255H885" class="cyan"/>
  <g transform="translate(890 145)">
    <rect width="245" height="220" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" filter="url(#s)"/>
    <text x="122" y="38" class="h">differentiable JPEG</text>
    <text x="122" y="70" class="b">YCbCr · 4:2:0 · 8×8 DCT</text>
    <rect x="35" y="91" width="175" height="50" rx="12" fill="#fff" stroke="#a5b4fc"/>
    <text x="122" y="112" style="font:700 14px Inter,Helvetica,Arial,sans-serif;fill:#4f46e5;text-anchor:middle">forward: round(DCT ÷ T)</text>
    <text x="122" y="132" style="font:500 13px Inter,Helvetica,Arial,sans-serif;fill:#475569;text-anchor:middle">backward: identity gradient</text>
    <text x="122" y="171" class="b">IDCT · upsample · RGB</text><text x="122" y="199" class="h">reconstruction x̂JPEG</text>
  </g>
  <path d="M1135 255H1210" class="line"/>
  <g transform="translate(1215 180)">
    <rect width="130" height="150" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#s)"/>
    <rect x="32" y="25" width="66" height="55" rx="8" fill="#fdba74"/><path d="M32 72L51 52L68 68L81 49L98 67V80H32Z" fill="#5eead4"/>
    <text x="65" y="111" class="h">x̂JPEG</text><text x="65" y="134" class="b">distorted image</text>
  </g>

  <path d="M1280 330V420" class="line"/>
  <g transform="translate(1035 430)">
    <rect width="310" height="132" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="155" y="32" class="h">perceptual distortion</text>
    <text x="155" y="61" style="font:700 16px Inter,Helvetica,Arial,sans-serif;fill:#b91c1c;text-anchor:middle">1 − MS-SSIMRGB</text>
    <text x="155" y="87" style="font:700 15px Inter,Helvetica,Arial,sans-serif;fill:#b91c1c;text-anchor:middle">+ 0.25 (1 − MS-SSIMY)</text>
    <text x="155" y="112" class="b">optional JPEG MSE guard</text>
  </g>

  <path d="M1010 365V600H925" class="line"/>
  <g transform="translate(705 575)">
    <rect width="315" height="132" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="158" y="32" class="h">DCT symbol-rate proxy</text>
    <text x="158" y="60" style="font:700 16px Inter,Helvetica,Arial,sans-serif;fill:#6d28d9;text-anchor:middle">RDCT = −Σ log₂ pLaplace(k)</text>
    <text x="158" y="86" class="b">separate component × frequency models</text>
    <text x="158" y="111" class="b">training gradient—not reported file size</text>
  </g>

  <path d="M700 350V515H610" class="line"/>
  <g transform="translate(370 490)">
    <rect width="315" height="132" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="158" y="32" class="h">soft table entropy</text>
    <text x="158" y="60" style="font:700 16px Inter,Helvetica,Arial,sans-serif;fill:#15803d;text-anchor:middle">Rtable = −Σ log₂ pψ(T)</text>
    <text x="158" y="87" class="b">factorized Ballé-style density</text>
    <text x="158" y="111" class="b">optional regularizer; λtable = 0 in finalist</text>
  </g>

  <path d="M635 350V410H300" class="line"/>
  <g transform="translate(55 395)">
    <rect width="300" height="132" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="150" y="32" class="h">mirror autoencoder</text>
    <text x="150" y="59" class="b">T → transposed Conv + IGDN → x̂AE</text>
    <text x="150" y="86" style="font:700 16px Inter,Helvetica,Arial,sans-serif;fill:#c2410c;text-anchor:middle">LAE = MSE(x, x̂AE)</text>
    <text x="150" y="111" class="b">historical training tool; λAE = 0 in finalist</text>
  </g>

  <g transform="translate(55 740)">
    <rect width="860" height="74" rx="18" fill="#0f172a"/>
    <text x="430" y="31" style="font:700 17px Inter,Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle">L = λd D + 0.05 RDCT + λtable Rtable + λAE LAE + λMSE LMSE</text>
    <text x="430" y="56" style="font:400 14px Inter,Helvetica,Arial,sans-serif;fill:#cbd5e1;text-anchor:middle">the released continuation uses λd = 1, luma guard = 0.25, λtable = 0, λAE = 0, λMSE = 0</text>
  </g>
  <g transform="translate(940 720)">
    <rect width="405" height="114" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="202" y="30" class="h">release gate: real JPEG</text>
    <text x="202" y="57" class="b">integer DQTs → MozJPEG/libjpeg → file bytes</text>
    <text x="202" y="81" class="b">common decoder → MS-SSIM / PSNR</text>
    <text x="202" y="104" style="font:700 13px Inter,Helvetica,Arial,sans-serif;fill:#0e7490;text-anchor:middle">bpp = 8 × complete file bytes ÷ source pixels</text>
  </g>
</svg>
