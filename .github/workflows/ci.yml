name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install ".[test]" build twine
      - run: python tools/verify_release.py
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify safe model is packaged
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("xjpeg-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "xjpeg/weights/model.safetensors" in names
              assert not any(name.endswith((".pt", ".pth")) for name in names)
          PY

